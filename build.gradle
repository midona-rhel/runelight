// -Dlumina.dump=name (and the other lumina.* properties) reach the tests: OfflineRenderDumpTest draws and checks that dump
test {
	systemProperties System.getProperties().findAll { it.key.toString().startsWith('lumina.') }
	// the probes that draw a whole dump: -PtestHeap=8g
	maxHeapSize = project.findProperty('testHeap') ?: '512m'
}

apply from: 'gradle/scorecard.gradle'

// the flood volume against the oracle on the CPU (harness/FloodCpu): ./gradlew floodCpu -Pargs="fps1 CACHE"
tasks.register('floodCpu', JavaExec) {
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.midonarhel.lumina.harness.FloodCpu'
	jvmArgs '-Xmx6g'
	doFirst {
		args = project.property('args').toString().split(' ').findAll { it }
	}
}
