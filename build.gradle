plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.midonarhel.lumina.LuminaPluginTest'

dependencies {
	compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

	testImplementation 'junit:junit:4.12'
	testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
}

group = 'com.midonarhel'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

// Dev client with this plugin loaded. Shaders are read from src/main/resources and hot reloaded on save.
tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass
	workingDir = projectDir

	jvmArgs '-ea:net.runelite...', '-ea:com.midonarhel...'
	if (System.getProperty('os.name').toLowerCase().contains('mac')) {
		// RuneLite's macOS fullscreen support uses this internal API; the official launcher opens it the same way
		jvmArgs '--add-exports=java.desktop/com.apple.eawt=ALL-UNNAMED', '--add-opens=java.desktop/com.apple.eawt=ALL-UNNAMED'
	}
	args '--developer-mode'
}

// Re-run the production light culler on captured scene data; no game or GL context needed.
tasks.register('sceneClusterReplay', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.midonarhel.lumina.SceneClusterReplay'
    doFirst {
        args project.property('sceneCapture'), project.property('replayOutput')
    }
}

// The offline renderer (docs/offline-render.md): a scene dump (::runelight scenedump name) drawn headless through the
// plugin's own frame, to ~/.runelite/lumina/dumps/<name>/offline/. -Pdump=name (or a directory, or synthetic);
// -Pargs="hour=6 views=all key=value ..." for the overrides.
tasks.register('renderDump', JavaExec) {
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.midonarhel.lumina.harness.RenderDump'
	workingDir = projectDir
	jvmArgs '-ea:com.midonarhel...'
	doFirst {
		args = [project.property('dump')] + (project.hasProperty('args') ? project.property('args').toString().split(' ').findAll { it } : [])
	}
}

// the frame's cost by pass on the bench (harness PassCost): ./gradlew passCost -Pargs="dumps=first hours=12,21 frames=60 out=FILE"
tasks.register('passCost', JavaExec) {
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.midonarhel.lumina.harness.PassCost'
	workingDir = projectDir
	jvmArgs '-Xmx8g'
	// -Pjvm="..." more JVM arguments (a flight recording, say)
	if (project.hasProperty('jvm')) {
		jvmArgs project.property('jvm').toString().split(' ').findAll { it }
	}
	doFirst {
		args = project.hasProperty('args') ? project.property('args').toString().split(' ').findAll { it } : []
	}
}

// two directories of PNGs compared pixel by pixel (harness ImageDiff): ./gradlew imageDiff -Pargs="BEFORE AFTER DIFF"
tasks.register('imageDiff', JavaExec) {
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.midonarhel.lumina.harness.ImageDiff'
	workingDir = projectDir
	doFirst {
		args = project.property('args').toString().split(' ').findAll { it }
	}
}

// the triangles each section of a frame draws (harness PrimCount): ./gradlew primCount -Pargs="nightref tree1"
tasks.register('primCount', JavaExec) {
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.midonarhel.lumina.harness.PrimCount'
	workingDir = projectDir
	jvmArgs '-Xmx8g'
	doFirst { args = project.property('args').toString().split(' ').findAll { it } }
}

// -Dlumina.dump=name (and the other lumina.* properties) reach the tests: OfflineRenderDumpTest draws and checks that dump
test {
	systemProperties System.getProperties().findAll { it.key.toString().startsWith('lumina.') }
}
